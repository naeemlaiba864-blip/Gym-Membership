<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>

        <h1>Gym Membership</h1>

<form>

    <label for="name">Member Name:</label>
    <input type="text" id="name" name="name" placeholder="Member Name" required>
    <br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" name="age" placeholder="Age" min="18" required>
    <small style="color:red;">Only applicants aged 18 years or above can apply.</small>
    <br><br>

    <label for="membership">Membership Type:</label>
    <select id="membership" name="membership" required>
        <option value="">Select Membership Type</option>
        <option value="Basic">Basic</option>
        <option value="Premium">Premium</option>
        <option value="VIP">VIP</option>
    </select>
    <br><br>

    <button type="button" onclick="checkEligibility()">
        Check Eligibility
    </button>

    <p id="result"></p>

</form>
    

</body>
</html>
